# SPDX-License-Identifier: GPL-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash runs each step with -eo pipefail, so a failed build
# piped into tail fails the step.
defaults:
  run:
    shell: bash

# The released components the package set is evaluated and built with.
env:
  LATTICE_VERSION: "0.14.0"
  TRELLIS_VERSION: "1.1.0"

jobs:
  evaluate:
    name: Evaluate the package set
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the components
        run: pip install "pyrixos-lattice==$LATTICE_VERSION" "trellis-kconfig==$TRELLIS_VERSION"

      - name: Check the generated configurations
        run: |
          for defconfig in pkgs/systems/*/defconfig; do
            dir=$(dirname "$defconfig")
            cp "$dir/config.pyb" "$RUNNER_TEMP/config.pyb"
            trellis --kconfig pkgs/Kconfig --defconfig "$defconfig" \
              --config "$RUNNER_TEMP/config.pyb" olddefconfig
            diff -u "$dir/config.pyb" "$RUNNER_TEMP/config.pyb"
          done

      - name: Evaluate every description
        run: |
          printf '[store]\nroot = "%s"\n' "$RUNNER_TEMP/store" > "$RUNNER_TEMP/settings.toml"
          find pkgs/systems -name '*.pyb' ! -name config.pyb | sort | while read -r file; do
            echo "::group::$file"
            lattice --settings "$RUNNER_TEMP/settings.toml" eval --package-set pkgs "$file"
            echo "::endgroup::"
          done

  # Building needs the store of the project's builder machine, a
  # self-hosted runner with the label pyrixos-builder. The job runs only
  # when the repository variable PYRIXOS_BUILDER is true, and never for a
  # pull request, whose code must not run on that machine.
  images:
    name: Build, boot and publish (x86_64)
    needs: evaluate
    if: vars.PYRIXOS_BUILDER == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, pyrixos-builder]
    concurrency: pyrixos-builder
    timeout-minutes: 1440
    env:
      SETTINGS: ${{ vars.LATTICE_SETTINGS }}
      STORE_ROOT: ${{ vars.STORE_ROOT }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the components
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "pyrixos-lattice==$LATTICE_VERSION" "trellis-kconfig==$TRELLIS_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build the images
        run: |
          settings=()
          [ -z "$SETTINGS" ] || settings=(--settings "$SETTINGS")
          build() {
            out=$(lattice "${settings[@]}" build --package-set pkgs "$1" "$2" | tail -n 1) || return
            echo "${STORE_ROOT:-/lattice}/store/${out#/lattice/store/}"
          }
          work="$RUNNER_TEMP/images"
          mkdir -p "$work"
          install -m 644 "$(build pkgs/systems/default.pyb image)/pyrixos.img" "$work/disk.img"
          install -m 644 "$(build pkgs/systems/installer.pyb image)/pyrixos-inst.img" "$work/installer.img"
          install -m 644 "$(build pkgs/systems/live.pyb image)/pyrixos-live.iso" "$work/live.iso"
          vm=$(build pkgs/systems/default.pyb vm)
          for format in qcow2 vhdx vdi; do
            install -m 644 "$vm/pyrixos.$format" "$work/vm.$format"
          done
          netboot=$(build pkgs/systems/live.pyb netboot)
          wsl=$(build pkgs/systems/wsl.pyb image)
          echo "NETBOOT=$netboot" >> "$GITHUB_ENV"
          echo "WSL=$wsl" >> "$GITHUB_ENV"

      - name: Boot the disk image
        run: scripts/boot-test.sh "$RUNNER_TEMP/images/disk.img" "$RUNNER_TEMP/images/disk.log"

      - name: Boot the virtual machine disks
        run: |
          for format in qcow2 vhdx vdi; do
            scripts/boot-test.sh "$RUNNER_TEMP/images/vm.$format" "$RUNNER_TEMP/images/vm-$format.log"
          done

      - name: Boot the live ISO as a CD, as a USB disk and with BIOS
        run: |
          iso="$RUNNER_TEMP/images/live.iso"
          scripts/boot-test.sh "$iso" "$RUNNER_TEMP/images/live-cd.log"
          MEDIUM=disk scripts/boot-test.sh "$iso" "$RUNNER_TEMP/images/live-usb.log"
          FIRMWARE=bios scripts/boot-test.sh "$iso" "$RUNNER_TEMP/images/live-bios.log"

      - name: Boot over the network
        run: scripts/boot-test.sh "$NETBOOT" "$RUNNER_TEMP/images/netboot.log"

      - name: Check the WSL root file system
        run: |
          f=$(echo "$WSL"/*.tar.gz)
          list=$(tar -tzf "$f")
          for p in ./etc/wsl.conf ./sbin/init ./lattice/profiles/system; do
            grep -qxF "$p" <<< "$list" || { echo "::error::$p is missing from $f"; exit 1; }
          done
          link=$(tar -tvzf "$f" ./lattice/profiles/system | sed 's/.* -> //')
          store=$(tar -tvzf "$f" "./lattice/profiles/$link" | sed 's/.* -> //')
          grep -qxF ".$store/init" <<< "$list" || { echo "::error::the system profile has no init"; exit 1; }
          tar -xzOf "$f" ./etc/wsl.conf | grep -qx 'systemd=true' || { echo "::error::wsl.conf does not start systemd"; exit 1; }
          echo "WSL root file system: $store"

      - name: Install from the installer image
        run: scripts/install-test.sh "$RUNNER_TEMP/images/installer.img" "$RUNNER_TEMP/images/install"

      - name: Publish to the binary cache
        if: github.ref == 'refs/heads/main'
        env:
          LATTICE: lattice
          CACHE_DIR: ${{ vars.CACHE_DIR }}
          CACHE_DEST: ${{ vars.CACHE_DEST }}
          SYNC: ${{ vars.CACHE_SYNC }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
        run: |
          scripts/publish-cache.sh \
            pkgs/systems/default.pyb system \
            -- pkgs/systems/installer.pyb system \
            -- pkgs/systems/live.pyb system \
            -- pkgs/systems/wsl.pyb system

      - name: Keep the console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-logs
          path: |
            ${{ runner.temp }}/images/*.log
            ${{ runner.temp }}/images/install/*.log
          if-no-files-found: ignore

      - name: Remove the image copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/images"

  # The riscv64 and aarch64 images, built on the same machine with QEMU
  # user emulation. Each disk image is booted with UEFI and with the U-Boot
  # firmware built beside it. The two architectures queue for the single
  # builder in their own concurrency groups, so neither cancels the other
  # or the x86_64 job. They wait for the x86_64 job, which is quick when
  # little has changed, so its results do not wait hours behind emulated
  # builds. They run whether it passed or failed.
  images-cross:
    name: Build, boot and publish (${{ matrix.arch }})
    needs: [evaluate, images]
    if: >-
      !cancelled() && needs.evaluate.result == 'success'
      && vars.PYRIXOS_BUILDER == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, pyrixos-builder]
    concurrency: pyrixos-builder-${{ matrix.arch }}
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      SETTINGS: ${{ vars.LATTICE_SETTINGS }}
      STORE_ROOT: ${{ vars.STORE_ROOT }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the components
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "pyrixos-lattice==$LATTICE_VERSION" "trellis-kconfig==$TRELLIS_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build the image and the firmware
        run: |
          settings=()
          [ -z "$SETTINGS" ] || settings=(--settings "$SETTINGS")
          build() {
            out=$(lattice "${settings[@]}" build --package-set pkgs "pkgs/systems/$ARCH/default.pyb" "$1" | tail -n 1) || return
            echo "${STORE_ROOT:-/lattice}/store/${out#/lattice/store/}"
          }
          work="$RUNNER_TEMP/images-$ARCH"
          mkdir -p "$work"
          install -m 644 "$(build image)/pyrixos.img" "$work/disk.img"
          uboot=$(build firmware)
          echo "UBOOT=$uboot" >> "$GITHUB_ENV"

      - name: Boot the disk image with UEFI
        run: scripts/boot-test.sh "$RUNNER_TEMP/images-$ARCH/disk.img" "$RUNNER_TEMP/images-$ARCH/uefi.log"

      - name: Boot the disk image with U-Boot
        env:
          FIRMWARE: u-boot
        run: scripts/boot-test.sh "$RUNNER_TEMP/images-$ARCH/disk.img" "$RUNNER_TEMP/images-$ARCH/u-boot.log"

      - name: Publish to the binary cache
        if: github.ref == 'refs/heads/main'
        env:
          LATTICE: lattice
          CACHE_DIR: ${{ vars.CACHE_DIR }}
          CACHE_DEST: ${{ vars.CACHE_DEST }}
          SYNC: ${{ vars.CACHE_SYNC }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
        run: scripts/publish-cache.sh "pkgs/systems/$ARCH/default.pyb" system firmware

      - name: Keep the console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/images-${{ matrix.arch }}/*.log
          if-no-files-found: ignore

      - name: Remove the image copy
        if: always()
        run: rm -rf "$RUNNER_TEMP/images-$ARCH"
